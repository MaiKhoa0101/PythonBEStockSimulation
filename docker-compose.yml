services:

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    networks:
      - app_network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pKute12345"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s 

  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./media:/app/media
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy    # ← chờ MySQL healthy mới khởi động
      redis:
        condition: service_started
    networks:
      - app_network

  worker:
    build: .
    command: celery -A src.infrastructure.celery.celery_app.celery_instance worker --loglevel=info
    volumes:
      - .:/app
      - ./media:/app/media
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy    # ← worker cũng chờ MySQL
      redis:
        condition: service_started
    networks:
      - app_network
  flower:
    build: .
    command: celery -A src.infrastructure.celery.celery_app.celery_instance flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - app_network

  beat:
    build: .
    command: celery -A src.infrastructure.celery.celery_app.celery_instance beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - app_network



networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:

